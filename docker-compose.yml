services:
  pm2-eid-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: pm2-eid-dashboard:latest
    container_name: pm2-eid-dashboard
    restart: unless-stopped
    ports:
      # Bound to localhost by default for security. Change to 3847:3847 only if behind a secure reverse proxy/VPN.
      - "127.0.0.1:3847:3847"
    environment:
      - PORT=3847
      - HOST=0.0.0.0
      - NODE_ENV=production
      # PM2 home directory inside container mapped to host
      - PM2_HOME=/root/.pm2
      # Disable PM2 version check telemetry to version.pm2.io
      - PM2_DISABLE_VERSION_CHECK=1
      # Required when HOST=0.0.0.0: Set AUTH_PASS in .env before running docker compose
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASS=${AUTH_PASS:?Set AUTH_PASS in .env before starting container}
      # Optional: Configurable Webhook notifications
      # - WEBHOOK_URL=https://discord.com/api/webhooks/your-webhook-id/your-webhook-token
      # - WEBHOOK_FORMAT=discord   # options: discord | slack | generic
      # - WEBHOOK_EVENTS=restart,stop,exit,errored
    volumes:
      # Mount host PM2 daemon and sockets into the container
      - ~/.pm2:/root/.pm2
      # Optional: mount host logs if bots write outside PM2 log dir
      # - /var/log:/var/log:ro
